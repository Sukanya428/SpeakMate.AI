<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeakMate AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <div class="logo">
        <img src="images/logo.png" alt="Logo">
        <span>SpeakMate AI</span>
    </div>

    <button class="start-btn" onclick="window.location.href='chat.html'">
        Start Speaking
    </button>
</nav>

<section class="hero">

    <div class="hero-text">

        <h1>Hello, User 👋</h1>

        <p>
            Improve your English speaking with an AI conversation partner.
        </p>

        <button onclick="window.location.href='chat.html'">
            Start Conversation
        </button>

    </div>

    <div class="hero-image">

        <img src="images/robot.png" alt="Robot">

    </div>

</section>

</body>
</html>
